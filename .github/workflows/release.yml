name: Release

# Deploys to Vercel only when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Vercel's own git integration is disabled in vercel.json, so ordinary pushes
# and pull requests never deploy.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_RxiHr84ISl4VVFkgj8ULVOD7
  VERCEL_PROJECT_ID: prj_IZJhyqheBGxKcGQO1f9hmsjbHzM1
  APP_DOMAIN: exercise-writer.vercel.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
      # Vercel builds remotely (Preview environment), so the build gets the
      # Neon variables and runs database migrations before `next build`.
      - name: Deploy to Vercel (Preview)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(npx --yes vercel@66.6.0 deploy --yes --token "$VERCEL_TOKEN" \
            --meta githubCommitSha=${{ github.sha }} --meta release=${{ github.ref_name }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"
      - name: Point ${{ env.APP_DOMAIN }} at this release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@66.6.0 alias set "${{ steps.deploy.outputs.url }}" "$APP_DOMAIN" \
            --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
      - name: Summary
        run: |
          echo "### Released ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: https://${APP_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
